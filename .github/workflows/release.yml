name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  release:
    name: Validate and build
    # Pinned to a dated image: ubuntu-latest moved to Ubuntu 26.04 from
    # 2026-10-19, so the floating label would change this job's OS without a
    # commit here. The build sets CGO_ENABLED=0, so the image the binary is
    # built on cannot raise the glibc floor of the released archive.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # The tag names the archives and the release, while version.Number is what
      # the daemon reports. Nothing else connects the two, so a tag pushed
      # against a stale constant would publish archives named for the new tag
      # containing a binary that still answers with the old one. The versions
      # are described rather than written out on purpose: the pair named here
      # when this comment was added went stale on the very next release.
      - name: Verify tag matches the version constant
        run: |
          set -euo pipefail
          declared=$(grep -oP '(?<=^const Number = ")[^"]+' daemon/internal/version/version.go)
          if [ "${GITHUB_REF_NAME}" != "v${declared}" ]; then
            printf 'tag %s does not match version.Number %s\n' "${GITHUB_REF_NAME}" "${declared}" >&2
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Check shell scripts
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck
          shellcheck -s sh install.sh uninstall.sh

      - name: Run tests
        run: go test -race ./...

      - name: Run vet
        run: go vet ./...

      - name: Build release archives
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          mkdir -p dist
          for arch in amd64 arm64; do
            package="cliamp-plugin-discord-rpc_${GITHUB_REF_NAME}_linux_${arch}"
            stage="dist/${package}"
            mkdir -p "${stage}"
            GOOS=linux GOARCH="${arch}" go build \
              -trimpath \
              -ldflags="-s -w" \
              -o "${stage}/cliamp-rpcd" \
              ./daemon/cmd/cliamp-rpcd
            cp discord-rpc.lua cliamp-rpcd.service install.sh uninstall.sh README.md "${stage}/"
            chmod 755 "${stage}/install.sh" "${stage}/uninstall.sh"
            tar \
              --sort=name \
              --mtime='UTC 1970-01-01' \
              --owner=0 \
              --group=0 \
              --numeric-owner \
              -czf "dist/${package}.tar.gz" \
              -C dist "${package}"
            rm -rf "${stage}"
          done
          cd dist
          sha256sum ./*.tar.gz > checksums.txt

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: release-assets
          path: |
            dist/*.tar.gz
            dist/checksums.txt
          if-no-files-found: error

      - name: Attest release archives
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: 'dist/*.tar.gz'

  publish:
    name: Publish release
    needs: release
    # Pinned for the same reason as the build job above.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: release-assets
          path: dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            dist/*.tar.gz \
            dist/checksums.txt \
            --generate-notes \
            --title "${GITHUB_REF_NAME}" \
            --verify-tag
