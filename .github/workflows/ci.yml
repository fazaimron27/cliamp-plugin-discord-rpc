name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Test, vet, and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - name: Set up Go
        uses: actions/setup-go@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v6.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Check shell scripts
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck
          shellcheck -s sh install.sh uninstall.sh

      - name: Run tests
        run: go test -race ./...

      - name: Run vet
        run: go vet ./...

      - name: Build daemon
        run: go build ./daemon/cmd/cliamp-rpcd
