name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Test, vet, and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # The Lua contract tests skip when luajit is absent, which is right for a
      # local run and wrong here: CI must fail rather than pass by skipping.
      CLIAMP_REQUIRE_LUA: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - name: Set up Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Install lint tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential shellcheck luajit luarocks
          sudo luarocks install luacheck 1.2.0-1

      - name: Check shell scripts
        run: shellcheck -s sh install.sh uninstall.sh

      # Only the shipped plugin is linted. The Lua test fixtures under
      # daemon/tests/testdata are exercised by the contract tests, which run
      # them under luajit, so a syntax error there fails the suite anyway.
      - name: Check Lua plugin
        run: luacheck discord-rpc.lua

      - name: Run tests
        run: go test -race ./...

      - name: Run vet
        run: go vet ./...

      - name: Build daemon
        run: go build ./daemon/cmd/cliamp-rpcd
