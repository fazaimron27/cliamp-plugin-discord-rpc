# The gate every change passes: it runs the Go suite with the Lua contract tests
# required rather than skipped, lints the shell scripts and the shipped plugin,
# and builds the daemon. A failure here is what blocks a pull request, since this
# job's name is the required status check on main.
#
# The comments below are attached to the steps they explain, which is where a
# reader looks for them; the width bound and the sentence rules still apply.
name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Test, vet, and build
    # Pinned to a dated image: ubuntu-latest moved to Ubuntu 26.04 from
    # 2026-10-19, so the floating label would change this job's OS without a
    # commit here. See daemon/internal/version/workflows_test.go.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # The Lua contract tests skip when luajit is absent, which is right for a
      # local run and wrong here: CI must fail rather than pass by skipping.
      CLIAMP_REQUIRE_LUA: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Install lint tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential shellcheck luajit luarocks
          sudo luarocks install luacheck 1.2.0-1

      - name: Check shell scripts
        run: shellcheck -s sh install.sh uninstall.sh

      # Only the shipped plugin is linted. The Lua test fixtures under the
      # playback and statewatch testdata directories are exercised by the
      # contract tests, which run them under luajit, so a syntax error there
      # fails the suite anyway.
      - name: Check Lua plugin
        run: luacheck discord-rpc.lua

      - name: Run tests
        run: go test -race ./...

      - name: Run vet
        run: go vet ./...

      - name: Build daemon
        run: go build ./daemon/cmd/cliamp-rpcd
